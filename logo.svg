<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0F172A" stroke="#334155" stroke-width="2"/>

  <!-- Signal waves (left) -->
  <path d="M 45 100 Q 38 85 45 70" stroke="#60A5FA" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 38 108 Q 26 88 38 62" stroke="#60A5FA" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Signal waves (right) -->
  <path d="M 155 100 Q 162 85 155 70" stroke="#60A5FA" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 162 108 Q 174 88 162 62" stroke="#60A5FA" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Central brain/node -->
  <circle cx="100" cy="85" r="22" fill="#1E3A5F" stroke="#3B82F6" stroke-width="2"/>

  <!-- Sparkle / AI indicator -->
  <circle cx="100" cy="85" r="8" fill="#60A5FA" opacity="0.9"/>
  <line x1="100" y1="72" x2="100" y2="65" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="100" y1="98" x2="100" y2="105" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="87" y1="85" x2="80" y2="85" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="113" y1="85" x2="120" y2="85" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Platform nodes -->
  <!-- Bluesky (left) -->
  <circle cx="58" cy="130" r="14" fill="#0085FF" opacity="0.9"/>
  <text x="58" y="135" text-anchor="middle" fill="white" font-size="13" font-family="sans-serif" font-weight="bold">B</text>

  <!-- X/Twitter (right) -->
  <circle cx="142" cy="130" r="14" fill="#111827" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="142" y="135" text-anchor="middle" fill="white" font-size="13" font-family="sans-serif" font-weight="bold">𝕏</text>

  <!-- Connector lines from brain to platforms -->
  <line x1="86" y1="103" x2="67" y2="118" stroke="#60A5FA" stroke-width="1.5" opacity="0.6" stroke-dasharray="3,2"/>
  <line x1="114" y1="103" x2="133" y2="118" stroke="#60A5FA" stroke-width="1.5" opacity="0.6" stroke-dasharray="3,2"/>

  <!-- Human approval checkmark (bottom center) -->
  <circle cx="100" cy="158" r="11" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <polyline points="93,158 98,163 107,153" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
